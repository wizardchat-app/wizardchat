# Signing the desktop updates needs the CI variables TAURI_SIGNING_PRIVATE_KEY,
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD and TAURI_UPDATER_PUBKEY (docs/BUILDING.md)
.desktop-build:
  stage: build
  extends: [.release-rules, .rust-cache]
  needs: []
  variables:
    CARGO_PROFILE_RELEASE_LTO: thin
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  artifacts:
    paths:
      - target/*-apple-darwin/release/bundle/macos/*.app.tar.gz*
      - target/*-apple-darwin/release/bundle/dmg/*.dmg
      - target/release/bundle/appimage/*.AppImage*
      - target/release/bundle/deb/*.deb*
      - target/release/bundle/rpm/*.rpm*
      - target/release/bundle/tarball/
      - target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe*
    expire_in: 1 day

build-desktop-mac:
  extends: .desktop-build
  tags: [saas-macos-medium-m1]
  parallel:
    matrix:
      - TARGET: [aarch64-apple-darwin, x86_64-apple-darwin]
  script:
    - !reference [.install-rust, script]
    - rustup target add "$TARGET"
    - curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE}/sccache-v${SCCACHE}-aarch64-apple-darwin.tar.gz" | tar -xz --strip-components=1 -C "$CARGO_HOME/bin" "sccache-v${SCCACHE}-aarch64-apple-darwin/sccache"
    - npm ci --ignore-scripts
    - node apps/desktop/scripts/release-config.mjs
    - npm run tokens
    - npm run build:release -w @wizardchat/desktop -- --target "$TARGET"
    - sccache --show-stats

build-desktop-linux:
  extends: .desktop-build
  image: node:22-bookworm
  variables:
    # linuxdeploy (the AppImage bundler) can't mount itself inside a container
    APPIMAGE_EXTRACT_AND_RUN: '1'
  script:
    - apt-get update && apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libx11-dev libxdo-dev libssl-dev patchelf file
    - !reference [.install-rust, script]
    - !reference [.install-sccache-linux, script]
    - npm ci --ignore-scripts
    - node apps/desktop/scripts/release-config.mjs
    - npm run tokens
    - npm run build:release -w @wizardchat/desktop -- --bundles appimage,deb
    # RPM versions can't contain '-': a pre-release 26.12.1-next.1 becomes 26.12.1 with release 0.next.1
    - |
      RPM_CONFIG=$(node -p "const [v, pre] = require('./package.json').version.split('-'); JSON.stringify(pre ? { version: v, bundle: { linux: { rpm: { release: '0.' + pre } } } } : {})")
      npm run tauri -w @wizardchat/desktop -- bundle --bundles rpm --config src-tauri/tauri.release.conf.json --config "$RPM_CONFIG"
    - node apps/desktop/scripts/package-linux.mjs
    - sccache --show-stats

build-desktop-arch:
  stage: build
  extends: .release-rules
  image: archlinux:base-devel
  needs: [build-desktop-linux]
  script:
    - useradd -m builder
    - cp -r target/release/bundle/tarball /tmp/arch && chown -R builder /tmp/arch
    - su builder -c 'cd /tmp/arch && makepkg --nodeps --noconfirm'
    - mkdir -p target/release/bundle/arch && cp /tmp/arch/*.pkg.tar.zst target/release/bundle/arch/
  artifacts:
    paths:
      - target/release/bundle/arch/*.pkg.tar.zst
    expire_in: 1 day

build-desktop-win:
  extends: .desktop-build
  image: node:22-trixie
  variables:
    XWIN_CACHE_DIR: $CI_PROJECT_DIR/.xwin
  cache:
    - key:
        files:
          - package-lock.json
      paths:
        - .npm/
    - key: cargo-$CI_JOB_NAME_SLUG
      paths:
        - .rustup/
        - .sccache/
    - key: xwin
      paths:
        - .xwin/
  script:
    - apt-get update && apt-get install -y --no-install-recommends nsis lld llvm clang
    - !reference [.install-rust, script]
    - rustup target add x86_64-pc-windows-msvc
    - !reference [.install-sccache-linux, script]
    - curl -sSfL "https://github.com/rust-cross/cargo-xwin/releases/download/v${CARGO_XWIN}/cargo-xwin-v${CARGO_XWIN}.x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$CARGO_HOME/bin" cargo-xwin
    - npm ci --ignore-scripts
    - node apps/desktop/scripts/release-config.mjs
    - npm run tokens
    - npm run build:release -w @wizardchat/desktop -- --runner cargo-xwin --target x86_64-pc-windows-msvc
    - sccache --show-stats

publish-desktop:
  stage: deploy
  extends: .release-rules
  image: node:22-alpine
  resource_group: desktop-feed
  needs:
    - build-desktop-mac
    - build-desktop-linux
    - build-desktop-win
    - build-desktop-arch
    - build-android
    - build-ios
    - job: build-fdroid
      artifacts: false
      optional: true
    - job: build-web-release
      artifacts: false
    - job: build-docker
      artifacts: false
    - job: release-notes
      artifacts: false
  script:
    - node .gitlab/scripts/publish-desktop.mjs
  artifacts:
    paths:
      - desktop-assets.json
    expire_in: 1 day
