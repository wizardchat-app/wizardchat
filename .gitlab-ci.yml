stages:
  - lint
  - prepare
  - build
  - deploy
  - release

variables:
  DRY_RUN: 'false'
  VERSION: ''
  PKGREL: '1'
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  RUSTUP_HOME: $CI_PROJECT_DIR/.rustup
  CARGO_TERM_COLOR: always
  npm_config_cache: $CI_PROJECT_DIR/.npm
  npm_config_prefer_offline: 'true'
  WASM_PACK: '0.15.0'
  SCCACHE: '0.19.0'
  CARGO_XWIN: '0.23.1'
  SCCACHE_DIR: $CI_PROJECT_DIR/.sccache
  SCCACHE_CACHE_SIZE: 3G
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: '0'

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-next\.\d+)?$/'

.node-cache: &node-cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

.cargo-cache: &cargo-cache
  key: cargo-$CI_JOB_NAME_SLUG
  paths:
    - .rustup/
    - .sccache/

.rust-web: &rust-web
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
  - export PATH="$CARGO_HOME/bin:$PATH"
  - rustup toolchain install
  - curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE}/sccache-v${SCCACHE}-x86_64-unknown-linux-musl.tar.gz" | tar -xz --strip-components=1 -C "$CARGO_HOME/bin" "sccache-v${SCCACHE}-x86_64-unknown-linux-musl/sccache"
  - curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK}/wasm-pack-v${WASM_PACK}-x86_64-unknown-linux-musl.tar.gz" | tar -xz --strip-components=1 -C "$CARGO_HOME/bin" "wasm-pack-v${WASM_PACK}-x86_64-unknown-linux-musl/wasm-pack"
  - npm ci --ignore-scripts

.branch-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^prepare\// || $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^prepare\// || $VERSION'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

.release-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      variables:
        PAGES_PROJECT: wizardchat
        WEB_URL: https://app.wizardchat.org
        RELEASE_NAME: Release
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-next\.\d+$/'
      variables:
        PAGES_PROJECT: wizardchat-next
        WEB_URL: https://next.wizardchat.org
        RELEASE_NAME: Pre-release

lint:
  stage: lint
  extends: .branch-rules
  interruptible: true
  image: node:22-alpine
  cache: *node-cache
  before_script:
    - npm ci --ignore-scripts
  script:
    - npm run lint
    - npm run format:check
    - npm run i18n

build-web:
  stage: build
  extends: .branch-rules
  interruptible: true
  image: node:22-bookworm
  cache:
    - *node-cache
    - *cargo-cache
  before_script: *rust-web
  script:
    - npm run build

prepare-release:
  stage: prepare
  image: node:22-alpine
  before_script:
    - apk add --no-cache git curl
    - |
      if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-next\.[0-9]+)?$'; then
        echo "ERROR: VERSION must match vYY.MM.PATCH or vYY.MM.PATCH-next.N (e.g. v26.5.0, v26.5.0-next.1). Got: $VERSION"
        exit 1
      fi
    - git config --global user.email "ci-bot@gitlab.com"
    - git config --global user.name "GitLab CI Bot"
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - |
      BRANCH="prepare/${VERSION}"
      VERSION_BARE="${VERSION#v}"
      case "$VERSION" in
        *-next.*) LABELS="release,pre-release" ;;
        *) LABELS="release" ;;
      esac
      echo "=== Preparing ${VERSION} ==="
      git checkout -b "$BRANCH"
      npm version "$VERSION_BARE" --no-git-tag-version
      if [ "$DRY_RUN" = "true" ]; then
        echo "=== DRY RUN: showing diff, skipping commit + MR ==="
        git diff
        exit 0
      fi
      git add package.json package-lock.json
      git commit -m "chore(release): prepare ${VERSION}"
      git push origin "$BRANCH" --force
      echo "=== Creating tag ${VERSION} ==="
      git tag -f "$VERSION" HEAD
      git push origin "$VERSION" --force
      curl --silent --fail \
        --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_RELEASE_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"source_branch\": \"${BRANCH}\",
          \"target_branch\": \"main\",
          \"title\": \"chore(release): prepare ${VERSION}\",
          \"description\": \"Bumps \`package.json\` to \`${VERSION_BARE}\`.\",
          \"labels\": \"${LABELS}\",
          \"assignee_id\": ${GITLAB_USER_ID},
          \"remove_source_branch\": true,
          \"squash\": true
        }" \
        "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests"
      echo "=== MR created for ${VERSION} ==="
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $VERSION'

build-web-release:
  stage: build
  extends: .release-rules
  image: node:22-bookworm
  cache:
    - *node-cache
    - *cargo-cache
  before_script: *rust-web
  script:
    - npm run build
  artifacts:
    paths:
      - apps/web/dist/
    expire_in: 1 hour

release-notes:
  stage: build
  extends: .release-rules
  image: alpine:3
  needs: []
  before_script:
    - apk add --no-cache git
  script:
    - git fetch --tags
    - git fetch --unshallow || true
    - |
      case "$CI_COMMIT_TAG" in
        *-next.*) NEXT=true ;;
        *) NEXT=false ;;
      esac

      if [ "$NEXT" = true ]; then
        PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CI_COMMIT_TAG}$" | head -n 1 || true)
      else
        PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${CI_COMMIT_TAG}$" | grep -v '\-next\.' | head -n 1 || true)
      fi
      if [ -z "$PREV_TAG" ]; then
        RANGE="${CI_COMMIT_SHA}"
        PREV_LABEL="the beginning of the project"
      else
        RANGE="${PREV_TAG}..${CI_COMMIT_TAG}"
        PREV_LABEL="${PREV_TAG}"
      fi
      COMMITS=$(git log "$RANGE" --pretty=format:"%h %s" --no-merges | grep -viE '^[a-f0-9]+ chore\(release\)' || true)

      entry() {
        while IFS= read -r line; do
          SHA=$(echo "$line" | cut -d' ' -f1)
          MSG=$(echo "$line" | cut -d' ' -f2-)
          printf -- "- %s ([%s](https://gitlab.com/%s/-/commit/%s))\n" "$MSG" "$SHA" "$CI_PROJECT_PATH" "$SHA"
        done
      }

      section() {
        LABEL="$1"
        shift
        LINES=""
        for PREFIX in "$@"; do
          MATCHES=$(echo "$COMMITS" | grep -iE "^[a-f0-9]+ ${PREFIX}" || true)
          if [ -n "$MATCHES" ]; then
            LINES=$(printf '%s\n%s' "$LINES" "$MATCHES")
          fi
        done
        LINES=$(echo "$LINES" | grep -v '^[[:space:]]*$' || true)
        if [ -n "$LINES" ]; then
          printf "\n### %s\n" "$LABEL"
          echo "$LINES" | entry
        fi
      }

      OTHER=$(echo "$COMMITS" | grep -ivE "^[a-f0-9]+ (feat|fix|perf|refactor|docs|chore|ci|test|build|style|revert)" || true)
      {
        if [ "$NEXT" = true ]; then
          printf "## Pre-release %s\n" "$CI_COMMIT_TAG"
          printf "\n> **This is a pre-release.** It may be unstable and is intended for testing purposes.\n"
        else
          printf "## What's Changed\n"
        fi
        printf "\nComparing [%s...%s](https://gitlab.com/%s/-/compare/%s...%s)\n" \
          "$PREV_LABEL" "$CI_COMMIT_TAG" "$CI_PROJECT_PATH" "${PREV_TAG:-}" "$CI_COMMIT_TAG"
        section "New Features" "feat(\([^)]*\))?!?:"
        section "Bug Fixes" "fix(\([^)]*\))?!?:"
        section "Performance" "perf(\([^)]*\))?!?:"
        section "Refactoring" "refactor(\([^)]*\))?!?:"
        section "Documentation" "docs(\([^)]*\))?!?:"
        section "Chores & Internals" "chore(\([^)]*\))?!?:" "ci(\([^)]*\))?!?:" "build(\([^)]*\))?!?:" "test(\([^)]*\))?!?:" "style(\([^)]*\))?!?:"
        section "Reverts" "revert(\([^)]*\))?!?:"
        if [ -n "$OTHER" ]; then
          printf "\n### Other\n"
          echo "$OTHER" | entry
        fi
        printf "\n---\n"
        if [ "$NEXT" = true ]; then
          printf "_Pre-release date: %s_\n" "$(date -u '+%Y-%m-%d')"
        else
          printf "_Released: %s_\n" "$(date -u '+%Y-%m-%d')"
        fi
      } > release-notes.md
  artifacts:
    paths:
      - release-notes.md
    expire_in: 1 hour

build-docker:
  stage: build
  extends: .release-rules
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  needs: [build-web-release]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
  script:
    - |
      docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" -f - apps/web <<'EOF'
      FROM nginx:alpine
      COPY dist /usr/share/nginx/html
      COPY nginx.conf /etc/nginx/conf.d/default.conf
      EXPOSE 80
      CMD ["nginx", "-g", "daemon off;"]
      EOF
      if [ "$DRY_RUN" = "true" ]; then
        echo "=== DRY RUN: image built but not pushed ==="
      else
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi

# Signing the desktop updates needs the CI variables TAURI_SIGNING_PRIVATE_KEY,
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD and TAURI_UPDATER_PUBKEY (docs/BUILDING.md)
.desktop-build:
  stage: build
  extends: .release-rules
  needs: []
  variables:
    CARGO_PROFILE_RELEASE_LTO: thin
    CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  cache:
    - *node-cache
    - *cargo-cache
  artifacts:
    paths:
      - target/*-apple-darwin/release/bundle/macos/*.app.tar.gz*
      - target/*-apple-darwin/release/bundle/dmg/*.dmg
      - target/release/bundle/appimage/*.AppImage*
      - target/release/bundle/deb/*.deb*
      - target/release/bundle/rpm/*.rpm*
      - target/release/bundle/tarball/
      - target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe*
    expire_in: 1 day

build-desktop-mac:
  extends: .desktop-build
  tags: [saas-macos-medium-m1]
  parallel:
    matrix:
      - TARGET: [aarch64-apple-darwin, x86_64-apple-darwin]
  script:
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup toolchain install
    - rustup target add "$TARGET"
    - curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE}/sccache-v${SCCACHE}-aarch64-apple-darwin.tar.gz" | tar -xz --strip-components=1 -C "$CARGO_HOME/bin" "sccache-v${SCCACHE}-aarch64-apple-darwin/sccache"
    - npm ci --ignore-scripts
    - node apps/desktop/scripts/release-config.mjs
    - npm run tokens
    - npm run build:release -w @wizardchat/desktop -- --target "$TARGET"
    - sccache --show-stats

build-desktop-linux:
  extends: .desktop-build
  image: node:22-bookworm
  variables:
    # linuxdeploy (the AppImage bundler) can't mount itself inside a container
    APPIMAGE_EXTRACT_AND_RUN: '1'
  script:
    - apt-get update && apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libx11-dev libxdo-dev libssl-dev patchelf file
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup toolchain install
    - curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE}/sccache-v${SCCACHE}-x86_64-unknown-linux-musl.tar.gz" | tar -xz --strip-components=1 -C "$CARGO_HOME/bin" "sccache-v${SCCACHE}-x86_64-unknown-linux-musl/sccache"
    - npm ci --ignore-scripts
    - node apps/desktop/scripts/release-config.mjs
    - npm run tokens
    - npm run build:release -w @wizardchat/desktop -- --bundles appimage,deb
    # RPM versions can't contain '-': a pre-release 26.12.1-next.1 becomes 26.12.1 with release 0.next.1
    - |
      RPM_CONFIG=$(node -p "const [v, pre] = require('./package.json').version.split('-'); JSON.stringify(pre ? { version: v, bundle: { linux: { rpm: { release: '0.' + pre } } } } : {})")
      npm run tauri -w @wizardchat/desktop -- bundle --bundles rpm --config src-tauri/tauri.release.conf.json --config "$RPM_CONFIG"
    - node apps/desktop/scripts/package-linux.mjs
    - sccache --show-stats

build-desktop-arch:
  stage: build
  extends: .release-rules
  image: archlinux:base-devel
  needs: [build-desktop-linux]
  script:
    - useradd -m builder
    - cp -r target/release/bundle/tarball /tmp/arch && chown -R builder /tmp/arch
    - su builder -c 'cd /tmp/arch && makepkg --nodeps --noconfirm'
    - mkdir -p target/release/bundle/arch && cp /tmp/arch/*.pkg.tar.zst target/release/bundle/arch/
  artifacts:
    paths:
      - target/release/bundle/arch/*.pkg.tar.zst
    expire_in: 1 day

build-desktop-win:
  extends: .desktop-build
  image: node:22-trixie
  variables:
    XWIN_CACHE_DIR: $CI_PROJECT_DIR/.xwin
  cache:
    - *node-cache
    - *cargo-cache
    - key: xwin
      paths:
        - .xwin/
  script:
    - apt-get update && apt-get install -y --no-install-recommends nsis lld llvm clang
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup toolchain install
    - rustup target add x86_64-pc-windows-msvc
    - curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE}/sccache-v${SCCACHE}-x86_64-unknown-linux-musl.tar.gz" | tar -xz --strip-components=1 -C "$CARGO_HOME/bin" "sccache-v${SCCACHE}-x86_64-unknown-linux-musl/sccache"
    - curl -sSfL "https://github.com/rust-cross/cargo-xwin/releases/download/v${CARGO_XWIN}/cargo-xwin-v${CARGO_XWIN}.x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$CARGO_HOME/bin" cargo-xwin
    - npm ci --ignore-scripts
    - node apps/desktop/scripts/release-config.mjs
    - npm run tokens
    - npm run build:release -w @wizardchat/desktop -- --runner cargo-xwin --target x86_64-pc-windows-msvc
    - sccache --show-stats

build-android:
  stage: build
  extends: .release-rules
  image: node:22-bookworm
  needs: []
  variables:
    ANDROID_HOME: $CI_PROJECT_DIR/.android-sdk
    ANDROID_CMDLINE_TOOLS: '15859902'
    ANDROID_NDK: '28.2.13676358'
  cache:
    - *node-cache
    - *cargo-cache
  script:
    - test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD"
    - apt-get update && apt-get install -y --no-install-recommends openjdk-17-jdk-headless unzip cmake
    - curl -sSfL "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip" -o /tmp/cmdline-tools.zip
    - mkdir -p "$ANDROID_HOME/cmdline-tools" && unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
    - mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
    - (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
    - '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;$ANDROID_NDK" > /dev/null'
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
    - export PATH="$CARGO_HOME/bin:$PATH"
    - rustup toolchain install
    - curl -sSfL "https://github.com/mozilla/sccache/releases/download/v${SCCACHE}/sccache-v${SCCACHE}-x86_64-unknown-linux-musl.tar.gz" | tar -xz --strip-components=1 -C "$CARGO_HOME/bin" "sccache-v${SCCACHE}-x86_64-unknown-linux-musl/sccache"
    - npm ci --ignore-scripts
    - npm run assets
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/android/wizardchat-release.jks
    - printf 'storeFile=wizardchat-release.jks\nstorePassword=%s\nkeyAlias=wizardchat\nkeyPassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" > apps/android/keystore.properties
    - apps/android/scripts/build-core.sh
    - (cd apps/android && ./gradlew --no-daemon :app:assembleGplayRelease)
    - rm apps/android/wizardchat-release.jks apps/android/keystore.properties
    - mkdir -p target/android
    - cp apps/android/app/build/outputs/apk/gplay/release/app-gplay-release.apk "target/android/WizardChat_$(node -p "require('./package.json').version")_arm64.apk"
    - '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs target/android/*.apk'
    - sccache --show-stats
  artifacts:
    paths:
      - target/android/*.apk
    expire_in: 1 day

deploy:
  stage: deploy
  extends: .release-rules
  image: node:22-alpine
  needs:
    - build-web-release
    - job: build-docker
      artifacts: false
    - job: build-desktop-mac
      artifacts: false
    - job: build-desktop-linux
      artifacts: false
    - job: build-desktop-win
      artifacts: false
    - job: build-desktop-arch
      artifacts: false
  script:
    - |
      if [ "$DRY_RUN" = "true" ]; then
        echo "DRY RUN: would deploy apps/web/dist to $PAGES_PROJECT"
      else
        npx --yes wrangler@4 pages deploy apps/web/dist --project-name="$PAGES_PROJECT" --branch=main --commit-hash="$CI_COMMIT_SHA"
      fi
  environment:
    name: $PAGES_PROJECT
    url: $WEB_URL

publish-desktop:
  stage: deploy
  extends: .release-rules
  image: node:22-alpine
  resource_group: desktop-feed
  needs:
    - build-desktop-mac
    - build-desktop-linux
    - build-desktop-win
    - build-desktop-arch
    - build-android
  script:
    - node apps/desktop/scripts/publish-update.mjs
  artifacts:
    paths:
      - desktop-assets.json
    expire_in: 1 day

create-release:
  stage: release
  extends: .release-rules
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [release-notes, build-docker, deploy, publish-desktop]
  script:
    - |
      if [ "$DRY_RUN" = "true" ]; then
        echo "DRY RUN: GitLab release creation skipped"
        cat release-notes.md
      else
        ASSETS=$(cat desktop-assets.json)
        if [ "$ASSETS" != "[]" ]; then set -- --assets-link "$ASSETS"; fi
        release-cli create --name "$RELEASE_NAME $CI_COMMIT_TAG" --tag-name "$CI_COMMIT_TAG" --description "$(cat release-notes.md)" --ref "$CI_COMMIT_SHA" "$@"
      fi
