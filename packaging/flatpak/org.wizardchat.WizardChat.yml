# CI repackages the release's Linux tarball into a Flatpak bundle (docs/BUILDING.md)
id: org.wizardchat.WizardChat
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: wizardchat
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-run/tray-icon:create
  - --own-name=org.wizardchat.desktop.SingleInstance
modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  - name: wizardchat
    buildsystem: simple
    sources:
      - type: archive
        path: wizardchat-linux-x86_64.tar.gz
        strip-components: 0
      - type: file
        path: org.wizardchat.WizardChat.desktop
      - type: file
        path: ../../apps/desktop/src-tauri/icons/32x32.png
      - type: file
        path: ../../apps/desktop/src-tauri/icons/128x128.png
      - type: file
        path: ../../apps/desktop/src-tauri/icons/128x128@2x.png
      - type: file
        path: ../../apps/desktop/src-tauri/icons/icon.png
    build-commands:
      - install -Dm755 usr/bin/* /app/bin/wizardchat
      - install -Dm644 org.wizardchat.WizardChat.desktop -t /app/share/applications
      - install -Dm644 32x32.png /app/share/icons/hicolor/32x32/apps/$FLATPAK_ID.png
      - install -Dm644 128x128.png /app/share/icons/hicolor/128x128/apps/$FLATPAK_ID.png
      - install -Dm644 128x128@2x.png /app/share/icons/hicolor/256x256/apps/$FLATPAK_ID.png
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/$FLATPAK_ID.png
      - install -Dm644 LICENSE -t /app/share/licenses/$FLATPAK_ID
