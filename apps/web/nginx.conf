server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Cache static assets
    location ~* \.(js|css|wasm|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wav)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The service worker must be revalidated, or updates never reach clients
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Version check endpoint
    location = /version.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=60";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /youtube-player.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/youtube-player-headers.conf;
    }

    # SPA routing - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
